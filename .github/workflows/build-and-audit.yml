name: Build and Audit

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
